  <!-- 交互脚本（和首页完全一致，不用改） -->
  <script>
    // 导航栏滚动效果
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('bg-white', 'shadow-md', 'py-4');
        navbar.classList.remove('py-6');
      } else {
        navbar.classList.remove('bg-white', 'shadow-md', 'py-4');
        navbar.classList.add('py-6');
      }
    });
    
    // 移动端菜单开关
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      const icon = menuBtn.querySelector('i');
      if (mobileMenu.classList.contains('hidden')) {
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
      } else {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
      }
    });
    
    // 移动端一级菜单：作品集
    const worksDropdown = document.getElementById('worksDropdown');
    const worksSubmenu = document.getElementById('worksSubmenu');
    worksDropdown.addEventListener('click', (e) => {
      e.preventDefault();
      worksSubmenu.classList.toggle('hidden');
      const icon = worksDropdown.querySelector('i');
      icon.classList.toggle('fa-angle-down');
      icon.classList.toggle('fa-angle-up');
    });
    
    // 移动端二级菜单：视觉传达设计
    const visualDropdown = document.getElementById('visualDropdown');
    const visualSubmenu = document.getElementById('visualSubmenu');
    visualDropdown.addEventListener('click', (e) => {
      e.preventDefault();
      visualSubmenu.classList.toggle('hidden');
      const icon = visualDropdown.querySelector('i');
      icon.classList.toggle('fa-angle-down');
      icon.classList.toggle('fa-angle-up');
    });
    
    // 移动端二级菜单：摄影作品
    const photoDropdown = document.getElementById('photoDropdown');
    const photoSubmenu = document.getElementById('photoSubmenu');
    photoDropdown.addEventListener('click', (e) => {
      e.preventDefault();
      photoSubmenu.classList.toggle('hidden');
      const icon = photoDropdown.querySelector('i');
      icon.classList.toggle('fa-angle-down');
      icon.classList.toggle('fa-angle-up');
    });
    
    // 移动端一级菜单：生活记录
    const lifeDropdown = document.getElementById('lifeDropdown');
    const lifeSubmenu = document.getElementById('lifeSubmenu');
    lifeDropdown.addEventListener('click', (e) => {
      e.preventDefault();
      lifeSubmenu.classList.toggle('hidden');
      const icon = lifeDropdown.querySelector('i');
      icon.classList.toggle('fa-angle-down');
      icon.classList.toggle('fa-angle-up');
    });
    
    // 移动端二级菜单：旅行日记
    const travelDropdown = document.getElementById('travelDropdown');
    const travelSubmenu = document.getElementById('travelSubmenu');
    travelDropdown.addEventListener('click', (e) => {
      e.preventDefault();
      travelSubmenu.classList.toggle('hidden');
      const icon = travelDropdown.querySelector('i');
      icon.classList.toggle('fa-angle-down');
      icon.classList.toggle('fa-angle-up');
    });
    
    // 平滑滚动
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        if (!mobileMenu.classList.contains('hidden')) {
          mobileMenu.classList.add('hidden');
          const icon = menuBtn.querySelector('i');
          icon.classList.remove('fa-times');
          icon.classList.add('fa-bars');
        }
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  </script>
