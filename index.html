<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页 | 简约黑白风</title>
  <!-- 极简样式资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- 黑白极简配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // 仅保留黑白灰，无其他彩色
            black: '#000000',
            white: '#ffffff',
            gray: {
              100: '#f8f8f8',
              200: '#eaeaea',
              300: '#dddddd',
              400: '#bbbbbb',
              500: '#999999',
              600: '#777777',
              700: '#555555',
              800: '#333333',
              900: '#111111',
            }
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      /* 极简卡片hover动效 */
      .simple-card {
        @apply transition-all duration-400 ease-in-out hover:shadow-md hover:-translate-y-1 cursor-pointer;
      }
    }
  </style>
</head>

<!-- 黑白极简主体 -->
<body class="font-inter bg-gray-100 text-gray-900 antialiased">
  <!-- 极简导航栏 -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white shadow-sm py-3">
    <div class="container mx-auto px-4 md:px-8 flex justify-between items-center">
      <a href="/guoziying/" class="text-lg font-medium text-gray-900">我的个人主页</a>
      
      <!-- 桌面端极简导航 -->
      <nav class="hidden md:flex space-x-6">
        <a href="#intro" class="text-sm text-gray-700 hover:text-gray-900 transition-colors">简介</a>
        <a href="/guoziying/designs.html" class="text-sm text-gray-700 hover:text-gray-900 transition-colors">设计作品</a>
        <a href="/guoziying/life-photos.html" class="text-sm text-gray-700 hover:text-gray-900 transition-colors">生活照</a>
      </nav>
      
      <!-- 移动端极简菜单 -->
      <button class="md:hidden text-gray-900 focus:outline-none" id="mobileMenuBtn">
        <i class="fa fa-bars text-lg"></i>
      </button>
    </div>
    
    <!-- 移动端导航菜单 -->
    <div class="md:hidden hidden bg-white absolute w-full left-0 py-3 shadow-sm" id="mobileMenu">
      <div class="container mx-auto px-4 flex flex-col space-y-2">
        <a href="#intro" class="py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors">简介</a>
        <a href="/guoziying/designs.html" class="py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors">设计作品</a>
        <a href="/guoziying/life-photos.html" class="py-2 text-sm text-gray-700 hover:text-gray-900 transition-colors">生活照</a>
      </div>
    </div>
  </header>

  <!-- 核心跳转区域（极简黑白，生活照+设计作品卡片） -->
  <section class="h-screen flex items-center justify-center pt-16 relative">
    <!-- 可选：极简背景图（如需保留背景图，取消注释即可，已设低透明度） -->
    <!-- <div class="absolute inset-0 z-0">
      <img 
        src="你的背景图Raw链接" 
        alt="极简背景" 
        class="w-full h-full object-cover object-center opacity-5"
      >
    </div> -->

    <!-- 卡片内容（极简布局） -->
    <div class="container mx-auto px-4 text-center relative z-10">
      <h1 class="text-[clamp(1.5rem,5vw,2.8rem)] font-light mb-12 text-gray-900">
        生活 & 设计
      </h1>
      
      <!-- 两个核心跳转卡片（黑白极简风格） -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-3xl mx-auto">
        <!-- 设计作品卡片 -->
        <a href="/guoziying/designs.html" class="simple-card bg-white rounded-lg shadow-sm p-8 border border-gray-200">
          <i class="fa fa-paint-brush text-gray-800 text-4xl mb-4"></i>
          <h2 class="text-xl font-medium mb-2 text-gray-900">设计作品</h2>
          <p class="text-gray-600 text-sm">我的设计创作合集</p>
        </a>
        
        <!-- 生活照卡片 -->
        <a href="/guoziying/life-photos.html" class="simple-card bg-white rounded-lg shadow-sm p-8 border border-gray-200">
          <i class="fa fa-camera text-gray-800 text-4xl mb-4"></i>
          <h2 class="text-xl font-medium mb-2 text-gray-900">生活照</h2>
          <p class="text-gray-600 text-sm">日常美好瞬间记录</p>
        </a>
      </div>
    </div>
  </section>

  <!-- 极简简介板块 -->
  <section id="intro" class="py-20 bg-white">
    <div class="container mx-auto px-4 max-w-5xl">
      <h2 class="text-[clamp(1.2rem,3vw,1.8rem)] font-light mb-10 text-center text-gray-900">
        关于我
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
        <div class="aspect-square overflow-hidden rounded-lg border border-gray-200">
          <img src="你的个人照片Raw链接" alt="个人形象" class="w-full h-full object-cover">
        </div>
        <div class="space-y-4">
          <p class="text-base text-gray-700 leading-relaxed">
            专注设计创作，热爱生活记录，用极简的方式，分享我的作品与日常。
          </p>
          <p class="text-base text-gray-700 leading-relaxed">
            点击上方卡片，查看我的设计作品与生活照。
          </p>
        </div>
      </div>
    </div>
  </section>

  <!-- 极简页脚 -->
  <footer class="py-6 bg-gray-900 text-white text-center">
    <div class="container mx-auto px-4">
      <p class="text-sm text-gray-400">© 2025 个人主页 | 极简黑白风</p>
    </div>
  </footer>

  <!-- 极简交互脚本 -->
  <script>
    // 移动端菜单开关
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      icon.classList.toggle('fa-bars');
      icon.classList.toggle('fa-times');
    });

    // 锚点平滑滚动
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        if (!mobileMenu.classList.contains('hidden')) {
          mobileMenu.classList.add('hidden');
          mobileMenuBtn.querySelector('i').classList.replace('fa-times', 'fa-bars');
        }
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  </script>
</body>
</html>
