<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的生活照 | 郭紫莹</title>
  <!-- 复用样式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2c3e50',
            secondary: '#7f8c8d',
            accent: '#3498db',
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .photo-hover {
        @apply transition-all duration-500 ease-in-out hover:scale-[1.03] shadow-xl;
      }
    }
  </style>
</head>

<body class="font-inter bg-white text-primary antialiased pt-20">
  <!-- 返回首页按钮 -->
  <div class="container mx-auto px-4 md:px-8 py-4">
    <a href="/guoziying/" class="inline-flex items-center text-accent hover:text-accent/80 transition-colors">
      <i class="fa fa-arrow-left mr-2"></i> 返回首页
    </a>
  </div>

  <!-- 生活照内容 -->
  <section class="py-12 bg-white">
    <div class="container mx-auto px-4">
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-light mb-12 text-center">我的<span class="text-accent font-semibold">生活照</span></h1>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 max-w-6xl mx-auto">
        <!-- 生活照1 -->
        <div class="rounded-lg overflow-hidden photo-hover">
          <img src="https://picsum.photos/id/1018/800/800" alt="生活照1" class="w-full h-64 object-cover">
        </div>
        <!-- 生活照2 -->
        <div class="rounded-lg overflow-hidden photo-hover">
          <img src="https://picsum.photos/id/1019/800/800" alt="生活照2" class="w-full h-64 object-cover">
        </div>
        <!-- 生活照3 -->
        <div class="rounded-lg overflow-hidden photo-hover">
          <img src="https://picsum.photos/id/1020/800/800" alt="生活照3" class="w-full h-64 object-cover">
        </div>
        <!-- 生活照4 -->
        <div class="rounded-lg overflow-hidden photo-hover">
          <img src="https://picsum.photos/id/1021/800/800" alt="生活照4" class="w-full h-64 object-cover">
        </div>
        <!-- 新增生活照只需复制上面的卡片 -->
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="py-8 bg-primary text-white text-center mt-12">
    <div class="container mx-auto px-4">
      <p class="text-white/70 text-sm">© 2025 郭紫莹的个人网站</p>
    </div>
  </footer>
</body>
</html>
