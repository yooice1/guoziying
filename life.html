<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>生活照 | 我的个人网站</title>
  <!-- 复用公共样式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            main: '#000000',
            gray: {
              light: '#f8f9fa',
              mid: '#e9ecef',
              dark: '#343a40',
            }
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .photo-hover {
        @apply transition-all duration-500 ease-in-out hover:scale-[1.03] hover:shadow-xl;
      }
      .nav-scrolled {
        @apply bg-white shadow-md py-3;
      }
    }
  </style>
</head>

<body class="font-inter bg-gray-light text-gray-dark antialiased">
  <!-- 导航栏（与首页、设计页完全统一） -->
  <nav id="navbar" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 py-5 bg-white/90 backdrop-blur-sm">
    <div class="container mx-auto px-4 md:px-8">
      <div class="flex justify-between items-center">
        <a href="/guoziying/" class="text-main font-semibold text-xl">我的个人主页</a>
        
        <div class="hidden md:flex space-x-8">
          <a href="/guoziying/" class="hover:text-main transition-colors">首页</a>
          <a href="/guoziying/designs.html" class="hover:text-main transition-colors">设计作品</a>
          <a href="#" class="text-main font-medium">生活照</a>
          <a href="/guoziying/#contact" class="hover:text-main transition-colors">联系我</a>
        </div>
        
        <button id="mobileMenuBtn" class="md:hidden text-gray-dark focus:outline-none">
          <i class="fa fa-bars text-xl"></i>
        </button>
      </div>
    </div>
    
    <div id="mobileMenu" class="md:hidden hidden bg-white shadow-lg absolute top-full left-0 w-full">
      <div class="container mx-auto px-4 py-4 flex flex-col space-y-4">
        <a href="/guoziying/" class="py-2 hover:text-main transition-colors">首页</a>
        <a href="/guoziying/designs.html" class="py-2 hover:text-main transition-colors">设计作品</a>
        <a href="#" class="py-2 text-main font-medium">生活照</a>
        <a href="/guoziying/#contact" class="py-2 hover:text-main transition-colors">联系我</a>
      </div>
    </div>
  </nav>

  <!-- 生活照展示区域 -->
  <main class="pt-32 pb-16">
    <div class="container mx-auto px-4 md:px-8">
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-light mb-12 text-center">
        我的 <span class="text-main font-semibold">生活照</span>
      </h1>
      
      <!-- 照片分类筛选（微交互） -->
      <div class="flex flex-wrap justify-center gap-4 mb-10">
        <button class="px-4 py-2 bg-main text-white rounded-full text-sm hover:bg-gray-dark transition-colors">全部</button>
        <button class="px-4 py-2 bg-white hover:bg-gray-mid rounded-full text-sm transition-colors">旅行</button>
        <button class="px-4 py-2 bg-white hover:bg-gray-mid rounded-full text-sm transition-colors">日常</button>
        <button class="px-4 py-2 bg-white hover:bg-gray-mid rounded-full text-sm transition-colors">风景</button>
      </div>
      
      <!-- 生活照网格（鼠标悬停动效+响应式） -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        <!-- 生活照1（原创无版权） -->
        <div class="photo-hover bg-white rounded-lg shadow-md overflow-hidden">
          <img src="https://github.com/yooice1/guoziying/blob/main/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20251221151146_211_5.jpg?raw=true">
          <div class="p-4">
            <p class="text-sm text-gray-600">园林>yu>
          </div>
        </div>
        
        <!-- 生活照2 -->
        <div class="photo-hover bg-white rounded-lg shadow-md overflow-hidden">
          <img src="https://github.com/yooice1/guoziying/blob/main/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20251221151145_210_5.jpg?raw=true">
          <div class="p-4">
            <p class="text-sm text-gray-600">海边>ha>
          </div>
        </div>
        
        <!-- 生活照3 -->
        <div class="photo-hover bg-white rounded-lg shadow-md overflow-hidden">
          <img src="https://picsum.photos/id/1017/800/600" alt="风景记录" class="w-full h-64 object-cover">
          <div class="p-4">
            <p class="text-sm text-gray-600">山间风光 · 原创生活随拍</p>
          </div>
        </div>
        
        <!-- 生活照4 -->
        <div class="photo-hover bg-white rounded-lg shadow-md overflow-hidden">
          <img src="https://picsum.photos/id/1018/800/600" alt="美食打卡" class="w-full h-64 object-cover">
          <div class="p-4">
            <p class="text-sm text-gray-600">文艺咖啡馆 · 原创生活随拍</p>
          </div>
        </div>
        
        <!-- 生活照5 -->
        <div class="photo-hover bg-white rounded-lg shadow-md overflow-hidden">
          <img src="https://picsum.photos/id/1019/800/600" alt="户外游玩" class="w-full h-64 object-cover">
          <div class="p-4">
            <p class="text-sm text-gray-600">秋日公园 · 原创生活随拍</p>
          </div>
        </div>
        
        <!-- 生活照6 -->
        <div class="photo-hover bg-white rounded-lg shadow-md overflow-hidden">
          <img src="https://picsum.photos/id/1020/800/600" alt="文艺瞬间" class="w-full h-64 object-cover">
          <div class="p-4">
            <p class="text-sm text-gray-600">雨夜街景 · 原创生活随拍</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 页脚（与其他页面完全统一） -->
  <footer class="py-8 bg-gray-dark text-white text-center">
    <div class="container mx-auto px-4">
      <p class="text-white/70 text-sm">© 2025 我的个人网站 | 所有生活照均为原创</p>
    </div>
  </footer>

  <!-- 交互脚本 -->
  <script>
    // 导航栏滚动效果
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('bg-white', 'shadow-md', 'py-3');
        navbar.classList.remove('py-5');
      } else {
        navbar.classList.remove('bg-white', 'shadow-md', 'py-3');
        navbar.classList.add('py-5');
      }
    });
    
    // 移动端菜单开关
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
      const icon = mobileMenuBtn.querySelector('i');
      icon.classList.toggle('fa-bars');
      icon.classList.toggle('fa-times');
    });

    // 平滑滚动
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        if (!mobileMenu.classList.contains('hidden')) {
          mobileMenu.classList.add('hidden');
          mobileMenuBtn.querySelector('i').classList.replace('fa-times', 'fa-bars');
        }
        document.querySelector(this.getAttribute('href')).scrollIntoView({
          behavior: 'smooth'
        });
      });
    });
  </script>
</body>
</html>
